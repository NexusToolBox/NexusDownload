name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Install boundary checker dependency
        run: choco install ripgrep --yes --no-progress
      - run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
      - run: pnpm run check:boundaries
      - run: pnpm run check:i18n
      - run: pnpm run check:file-names
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - name: Build native test fixture
        run: pnpm run build:finalize-fs
      - run: pnpm test
