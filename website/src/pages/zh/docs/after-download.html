<h1>下载完成之后</h1>

<h2>打开文件</h2>
<p>在已完成的任务上选择「打开文件」，也可以打开文件所在的文件夹。</p>

<h2>按分类整理</h2>
<p>在「设置 → 下载」打开「按分类整理」。点「编辑规则」为匹配的文件指定子目录。</p>

<h2>解压下载包</h2>
<p>在下载包的选项中打开「整个包完成后解压」。需要时可勾选「解压成功后移入回收站」。若提示缺少工具，前往「设置 → 外部工具」安装。</p>
