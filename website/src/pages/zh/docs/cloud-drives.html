<h1>网盘账号</h1>
<p class="lead">支持百度网盘、夸克网盘、UC 网盘、115 网盘、123 云盘和阿里云盘。</p>

<h2>登录</h2>
<p>打开「设置 → 网盘账号」，在对应网盘旁点「登录」，按平台页面提示完成。</p>
<div class="note"><strong>阿里云盘</strong>先在阿里云盘开放平台申请应用，再按「配置阿里云盘」中的步骤填写「应用 ID」和「应用密钥」。</div>

<h2>下载文件</h2>
<ul>
  <li>在「网盘」中选择平台，从「我的文件」选择文件。</li>
  <li>下载分享文件时，点「打开分享链接」，粘贴链接和提取码，再点「打开分享目录」。</li>
</ul>
<p>网盘地址过期时，软件会尝试重新获取。若账号已退出，重新登录后再试。</p>
