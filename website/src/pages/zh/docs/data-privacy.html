<h1>数据与隐私</h1>

<h2>备份和迁移</h2>
<p>下载记录、设置和账号信息保存在程序旁的 <code>data</code> 文件夹。移动程序时一起保留。下载文件可能存放在其他位置，需要单独备份。</p>
<p>换电脑或换 Windows 用户后，需要重新登录网盘。</p>

<h2>卸载</h2>
<p>退出软件后删除程序文件夹。先备份要保留的 <code>data</code> 和下载文件。</p>

<h2>开源</h2>
<p>查看<a href="{{site.github}}" target="_blank" rel="noopener">源代码</a>及 {{site.license}} 许可。</p>
