<h2>快速开始</h2>
<ol class="steps">
  <li>从<a href="/download/">下载页</a>获取便携版 ZIP，解压到可写入的文件夹。</li>
  <li>打开 <code>NexusDownload.exe</code>。首次启动时阅读使用须知，选择「同意并继续」。</li>
  <li>点「添加下载」，粘贴链接。确认列表和保存位置后开始下载。</li>
</ol>
<div class="note note--warn"><strong>Windows 已保护你的电脑</strong>此版本未签名。确认下载来源后，选择「更多信息」，再选「仍要运行」。</div>
